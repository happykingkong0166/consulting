<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록깨기</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: 2px; }
  .hud {
    display: flex; gap: 24px; margin-bottom: 10px;
    font-size: 15px; color: var(--muted);
  }
  .hud b { color: var(--text); }
  .wrap { position: relative; width: 100%; max-width: 640px; }
  canvas {
    display: block; width: 100%; height: auto;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(15,23,42,.88);
    border-radius: 12px;
    text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; }
  .overlay p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 16px; font-weight: 700;
    padding: 12px 26px; border: none; border-radius: 10px;
    cursor: pointer; color: #0f172a;
    transition: transform .1s;
  }
  button:hover { transform: translateY(-2px); }
  .easy { background: var(--accent); }
  .normal { background: var(--accent2); }
  .help { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <h1>블록깨기</h1>
  <div class="hud">
    <span>난이도 <b id="lvl">-</b></span>
    <span>점수 <b id="score">0</b></span>
    <span>생명 <b id="lives">-</b></span>
  </div>

  <div class="wrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">난이도를 선택하세요</h2>
      <p id="msg">
        <b>초보</b> — 느린 공, 넓은 패들, 블록 3줄, 생명 5개<br>
        <b>중급</b> — 빠른 공, 좁은 패들, 블록 5줄, 생명 3개, 2번 맞춰야 깨지는 블록 포함
      </p>
      <div class="btns">
        <button class="easy" onclick="startGame('easy')">초보</button>
        <button class="normal" onclick="startGame('normal')">중급</button>
      </div>
    </div>
  </div>
  <p class="help">← → 방향키 또는 마우스·터치로 패들 이동 · 스페이스바로 일시정지</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// 난이도 설정
const LEVELS = {
  easy:   { name: '초보', speed: 4,   paddleW: 120, rows: 3, cols: 8,  lives: 5, toughRate: 0,   speedUp: 0 },
  normal: { name: '중급', speed: 5.5, paddleW: 80,  rows: 5, cols: 10, lives: 3, toughRate: 0.3, speedUp: 0.05 }
};
const COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];

let cfg, paddle, ball, bricks, score, lives, running = false, paused = false;
const keys = {};

function startGame(level) {
  cfg = LEVELS[level];
  score = 0;
  lives = cfg.lives;
  paddle = { w: cfg.paddleW, h: 12, x: (W - cfg.paddleW) / 2, y: H - 30, speed: 8 };
  buildBricks();
  resetBall();
  document.getElementById('lvl').textContent = cfg.name;
  updateHud();
  document.getElementById('overlay').classList.add('hidden');
  running = true;
  paused = false;
}

function buildBricks() {
  bricks = [];
  const pad = 6, top = 50, side = 20;
  const bw = (W - side * 2 - pad * (cfg.cols - 1)) / cfg.cols;
  const bh = 20;
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols; c++) {
      const tough = Math.random() < cfg.toughRate;
      bricks.push({
        x: side + c * (bw + pad),
        y: top + r * (bh + pad),
        w: bw, h: bh,
        hp: tough ? 2 : 1,
        color: COLORS[r % COLORS.length],
        alive: true
      });
    }
  }
}

function resetBall() {
  const angle = (Math.random() * 60 - 30) * Math.PI / 180;
  ball = {
    x: paddle.x + paddle.w / 2,
    y: paddle.y - 10,
    r: 8,
    dx: cfg.speed * Math.sin(angle),
    dy: -cfg.speed * Math.cos(angle)
  };
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = '♥'.repeat(lives);
}

function endGame(win) {
  running = false;
  document.getElementById('title').textContent = win ? '🎉 클리어!' : '게임 오버';
  document.getElementById('msg').innerHTML =
    `최종 점수: <b>${score}</b><br>다시 도전할 난이도를 선택하세요`;
  document.getElementById('overlay').classList.remove('hidden');
}

function update() {
  // 패들 이동 (키보드)
  if (keys['ArrowLeft'])  paddle.x -= paddle.speed;
  if (keys['ArrowRight']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // 공 이동
  ball.x += ball.dx;
  ball.y += ball.dy;

  // 벽 충돌
  if (ball.x - ball.r < 0)  { ball.x = ball.r;     ball.dx *= -1; }
  if (ball.x + ball.r > W)  { ball.x = W - ball.r; ball.dx *= -1; }
  if (ball.y - ball.r < 0)  { ball.y = ball.r;     ball.dy *= -1; }

  // 패들 충돌 — 맞은 위치에 따라 튕기는 각도 변화
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + 6 &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
    const angle = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
    const sp = Math.hypot(ball.dx, ball.dy);
    ball.dx = sp * Math.sin(angle);
    ball.dy = -sp * Math.cos(angle);
    ball.y = paddle.y - ball.r;
  }

  // 바닥에 떨어짐
  if (ball.y - ball.r > H) {
    lives--;
    updateHud();
    if (lives <= 0) return endGame(false);
    resetBall();
  }

  // 블록 충돌
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      // 어느 면에 맞았는지 판단
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;

      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        score += 10;
        // 중급: 블록을 깰 때마다 공이 조금씩 빨라짐
        if (cfg.speedUp) { ball.dx *= 1 + cfg.speedUp / 5; ball.dy *= 1 + cfg.speedUp / 5; }
      } else {
        score += 5;
      }
      updateHud();
      break;
    }
  }

  if (bricks.every(b => !b.alive)) endGame(true);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 블록
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.hp === 2 ? 1 : 0.85;
    roundRect(b.x, b.y, b.w, b.h, 4);
    if (b.hp === 2) { // 단단한 블록 표시
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // 패들
  ctx.fillStyle = '#e2e8f0';
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);

  // 공
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fde047';
  ctx.fill();

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('일시정지', W / 2, H / 2);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function loop() {
  if (running && !paused) update();
  if (cfg) draw();
  requestAnimationFrame(loop);
}

// 입력 처리
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.code === 'Space' && running) { paused = !paused; e.preventDefault(); }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function movePaddleTo(clientX) {
  if (!paddle) return;
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}
canvas.addEventListener('mousemove', e => movePaddleTo(e.clientX));
canvas.addEventListener('touchmove', e => { movePaddleTo(e.touches[0].clientX); e.preventDefault(); }, { passive: false });

loop();
</script>
</body>
</html>
