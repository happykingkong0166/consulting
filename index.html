<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경영진단 체크리스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 좌측 진단표(부문별 섹션) + 우측 고정 결과 패널(레이더·부문 점수). 모바일은 결과 패널이 위로. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#18202b; --muted:#5c6776; --line:#dde1e7; --soft:#eef1f5;
  --accent:#1f4e79; --accent-soft:#e3ecf5;
  --g5:#1f7a4d; --g4:#4f9a3a; --g3:#b58a12; --g2:#c8611f; --g1:#b3322b; --gx:#8a93a0;
  --gS:#17654a; --gA:#2f8a52; --gB:#6f9a24; --gC:#b58a12; --gD:#cc6a24; --gF:#b3322b;
  --display:"Noto Serif KR", "Apple SD Gothic Neo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --ink:#e7ebf0; --muted:#9aa4b2; --line:#2c3440; --soft:#212833;
  --accent:#7fb0de; --accent-soft:#1f3044;
  --g5:#4fbf86; --g4:#8cc66e; --g3:#e0b33f; --g2:#ea8a4c; --g1:#e8665d; --gx:#7b8594;
  --gS:#2f9d72; --gA:#43a865; --gB:#86a83a; --gC:#c99a26; --gD:#d9783a; --gF:#d4544b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --ink:#e7ebf0; --muted:#9aa4b2; --line:#2c3440; --soft:#212833;
  --accent:#7fb0de; --accent-soft:#1f3044;
  --g5:#4fbf86; --g4:#8cc66e; --g3:#e0b33f; --g2:#ea8a4c; --g1:#e8665d; --gx:#7b8594;
  --gS:#2f9d72; --gA:#43a865; --gB:#86a83a; --gC:#c99a26; --gD:#d9783a; --gF:#d4544b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);margin:4px 0 0;line-height:1.25;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:10px}
.meta label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.meta input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:150px}
.industry{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px;align-items:center}
.industry .lbl{font-size:13px;color:var(--muted);margin-right:4px;font-weight:600}
.industry button{font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.industry button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.hint{font-size:13px;color:var(--muted);margin:0 0 22px}
main#parts{max-width:980px;margin:0 auto}
.results{max-width:980px;margin:40px auto 0;scroll-margin-top:20px}
.results > h2{font-family:var(--display);font-size:24px;margin:0 0 4px;padding-top:24px;border-top:2px solid var(--ink)}
.results .lead{color:var(--muted);font-size:13px;margin:0 0 18px}
.overall{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
@media (max-width:760px){.overall{grid-template-columns:1fr}}
.ocard{display:flex;gap:20px;align-items:center}
.biggrade{width:96px;height:96px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:52px;font-weight:700;color:#fff;background:var(--gx);flex:none}
.ocard .gname2{font-size:20px;font-weight:700}
.ocard .idx{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.ocard .act{margin-top:8px;font-size:15px;font-weight:600}
.ocard .act span{display:block;font-weight:400;color:var(--muted);font-size:14px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
table.rt{width:100%;border-collapse:collapse;font-size:14px;min-width:680px;table-layout:fixed}
table.rt th.l{text-align:left}
.gt{display:inline-flex;align-items:center;gap:8px;width:6.2em;text-align:left;white-space:nowrap}
.gt .chip{flex:none}
table.rt th{background:var(--accent-soft);color:var(--ink);font-weight:600;padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.rt td{padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
table.rt tr:last-child td{border-bottom:0}
table.rt td.c{text-align:center;white-space:nowrap}
table.rt td.r{text-align:center;white-space:nowrap}
table.rt tr.sum td{background:var(--soft);font-weight:700}
table.rt tr.cur td{background:var(--accent-soft);font-weight:600}
table.rt td.sub{padding-left:28px;color:var(--ink)}
table.rt td.ph{font-weight:600;background:var(--soft)}
.h3{font-size:15px;font-weight:700;margin:24px 0 8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-bottom:16px;align-items:stretch}
@media (max-width:820px){.drow{grid-template-columns:1fr}}
.drow .tblwrap{margin-bottom:0}
.drow table.rt{min-width:520px}
.drow table.rt td{padding:12px}
.drow table.rt th.ph{background:var(--soft);text-align:left;font-size:15px}
.mini{padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.mini .mf{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.mini .mf b{color:var(--ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;font-size:13px}
.dock .bar{flex:1;margin:0}
.dock a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.dock .cnt{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.total{display:flex;align-items:center;gap:16px}
.badge{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700;color:#fff;background:var(--gx);flex:none}
.total .num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.total .num small{font-size:14px;color:var(--muted);font-weight:500}
.total .sub{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.secs{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.secrow{display:grid;grid-template-columns:1fr auto 30px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.secrow:last-child{border-bottom:0}
.secrow a{color:var(--ink);text-decoration:none;min-width:0}
.secrow a:hover{color:var(--accent)}
.secrow .sc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chip{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:4px;font-size:12px;font-weight:700;color:#fff;background:var(--gx)}
svg.radar text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.actions button.warn{color:var(--g1)}
.legend{font-size:12px;color:var(--muted);line-height:1.7}
.legend b{color:var(--ink)}
section.part{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
.parthead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.parthead h2{font-family:var(--display);font-size:19px;margin:0}
.parthead .ps{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.special{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:4px;margin-left:8px;vertical-align:middle}
.group{display:grid;grid-template-columns:120px minmax(0,1fr);border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.gname{padding:14px 16px;font-weight:600;font-size:14px;border-right:1px solid var(--line);background:var(--surface)}
.gname small{display:block;font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.group{grid-template-columns:1fr}.gname{border-right:0;border-bottom:1px dashed var(--line);padding:10px 14px;background:var(--soft)}.gname small{display:inline;margin-left:8px}}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.unanswered .q::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g3);margin-right:7px;vertical-align:middle}
.q{font-size:14.5px;min-width:0}
.q .n{color:var(--muted);margin-right:4px}
@media (max-width:760px){.item{grid-template-columns:1fr}}
.scale{display:flex;gap:4px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{display:grid;place-items:center;min-width:38px;height:36px;padding:0 4px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13px;line-height:1.05;text-align:center;color:var(--muted);user-select:none;background:var(--surface)}
.scale label b{display:block;font-size:12px;color:var(--ink)}
.scale label span{font-size:10px}
.scale label.x{min-width:44px;font-size:12px}
.scale input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.scale input:checked + label{color:#fff;border-color:transparent}
.scale input:checked + label b{color:#fff}
.scale input[value="5"]:checked + label{background:var(--g5)}
.scale input[value="4"]:checked + label{background:var(--g4)}
.scale input[value="3"]:checked + label{background:var(--g3)}
.scale input[value="2"]:checked + label{background:var(--g2)}
.scale input[value="1"]:checked + label{background:var(--g1)}
.scale input[value="x"]:checked + label{background:var(--gx)}
.colhead{display:flex;justify-content:flex-end;padding:6px 16px 0;font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>[hidden]{display:none!important} body{margin:0}
.golink{display:flex;justify-content:flex-end;margin:0 0 14px}
.golink a{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:7px 16px;text-decoration:none}
.golink a:hover{background:var(--accent);color:var(--surface)}
@media (max-width:640px){.golink{justify-content:flex-start}}</style>
</head>
<body>
<div class="wrap">
  <nav class="golink" aria-label="다른 설문">
    <a href="hr-survey/">인사조직 진단 설문(전 직원용) 바로가기 →</a>
  </nav>
  <header class="top">
    <div>
      <div class="eyebrow">대표이사·경영진 설문</div>
      <h1>경영진단 체크리스트</h1>
    </div>
    <div class="meta">
      <label for="m-co">기업명<input id="m-co" placeholder="㈜OOO"></label>
      <label for="m-who">응답자<input id="m-who" placeholder="대표이사"></label>
      <label for="m-date">진단일<input id="m-date" type="date"></label>
    </div>
  </header>

  <div class="industry" id="ind">
    <span class="lbl">업종</span>
  </div>
  <p class="hint">1~4부문은 공통, 5부문은 업종 특성 항목입니다. 각 문항을 V(5)~W(1)로 체크하면 맨 아래 진단 결과표에 점수와 평가등급(S~F)이 바로 반영됩니다. 해당 없는 문항은 ‘제외’를 고르면 평균에서 빠집니다.</p>

  <main id="parts"></main>

  <section class="results" id="result">
    <h2>진단 결과</h2>
    <p class="lead" id="r-lead"></p>
    <div class="overall">
      <div class="panel ocard">
        <div class="biggrade" id="r-grade">–</div>
        <div>
          <div class="eyebrow">종합 평가</div>
          <div class="gname2" id="r-gname">미응답</div>
          <div class="idx" id="r-idx"></div>
          <div class="act" id="r-act"></div>
        </div>
      </div>
      <div class="panel"><svg class="radar" id="radar" viewBox="0 0 340 290" width="100%" role="img" aria-label="부문별 평가지수 레이더 차트"></svg></div>
    </div>

    <div class="h3">부문별 평가결과</div>
    <div class="tblwrap"><table class="rt" id="t-parts"></table></div>

    <div class="h3">진단항목별 상세 및 세부항목 분석</div>
    <div id="detail"></div>

    <div class="h3">평가등급 기준</div>
    <div class="tblwrap"><table class="rt" id="t-crit"></table></div>

    <div class="actions">
      <button type="button" id="b-copy">결과 복사</button>
      <button type="button" id="b-reset" class="warn">현재 업종 초기화</button>
    </div>
    <div class="sub" id="msg" style="font-size:12px;color:var(--muted);min-height:1em;margin-top:6px"></div>
  </section>
  <div style="height:70px"></div>
</div>

<div class="dock"><div class="in">
  <span class="cnt" id="d-cnt"></span>
  <div class="bar"><i id="t-bar"></i></div>
  <a href="#result">결과 보기 ↓</a>
</div></div>

<script>
const COMMON = [
 {title:"전략 / 운영부문", groups:[
  ["경영전략",["외부환경분석을 시행하고 있는가?(시장 성장성, 시장 트렌드 등 환경변화)","사업전략 수립을 위해 내부역량을 분석하고 있는가?","사업전략을 수립하고 있으며, 그 내용은 적절한가?","업계의 경쟁구조를 분석하고 있으며, 경쟁전략을 수립하고 있는가?"]],
  ["경영계획",["경영방침 또는 이념이 정립되어 있으며, 전사적으로 공유하고 있는가?","경영계획(사업계획)을 수립하고 있으며, 회사 내부 부문별로 그 내용은 적절한가?","경영계획을 단기/중기/장기로 구분하여 수립하고 있는가?","사업은 경영계획에 따라 진행되고 있으며, 주기적으로 검토하고 있는가?"]],
  ["경영진역량",["최고경영자의 통찰력 및 지도력은 어떤가?","최고경영자의 기획력과 실행력은 어떤가?","경영간부의 해당 부문 역량은 어떤가?","경영진 내부의 의사소통, 업무협조, 화합 수준은 어떤가?"]],
  ["사업성",["사업 분야의 시장성은 어떤가? (시장규모, 성장성 등 고려)","기술능력(또는 판매능력, 서비스능력) 향상을 위한 투자 및 노력 수준은 어떤가?","경쟁사와 차별화된 부문이 있는가?(타사와 비교해서 경쟁력 있는 부문)","현재 영위하고 있는 사업의 수익성은 어떤가?(개략적인 판단)"]],
  ["운영전략",["핵심 업무 프로세스는 중복되거나 정체되는 곳 없이 원활하게 운영되고 있는가?","경영진 보고 및 결재 체계는 적절한가?(결재 중복, 결재단계 길이/시간 등 고려)","의사결정 시 임직원의 의견이 최대한 반영되고 있는가?"]]
 ]},
 {title:"마케팅 / 영업부문", groups:[
  ["마케팅 체계",["기업 경영이 고객 중심 체제로 되어 있는가?","마케팅전략 수립을 위한 시장조사 및 정보 수집을 시행하고 있는가?","마케팅전략 및 영업 전략을 수립하고 있으며, 그에 따라 활동하고 있는가?","고객관리를 시행하고 있는가?(고객 정보 분석, 고객만족도 조사 등)","마케팅 및 영업 역량은 어떤가?(인력 규모, 영업 경력 및 노하우 등)","고객 서비스 제고를 위한 B/S 및 A/S체계를 갖추고 있는가?(체계의 수준)"]],

 {g:"B", name:"양호 下", min:70, range:"70 이상 ~ 80 미만", act:"차별화 전략", desc:"사업 성공을 위해 차별화 전략이 필요"},
 {g:"C", name:"보통", min:50, range:"50 이상 ~ 70 미만", act:"부분적인 보완", desc:"사업의 부분적인 보완이 필요"},
 {g:"D", name:"불량", min:30, range:"30 이상 ~ 50 미만", act:"전면적인 보완", desc:"사업의 전면적인 보완이 필요"},
 {g:"F", name:"매우불량", min:-1, range:"30 미만", act:"사업 재설계", desc:"사업 전체에 대해 재설계가 필요"}
];
function gradeOf(idx){ if(idx==null) return null; const r=Math.round(idx*10)/10; return GRADES.find(x=>r>=x.min); }
function grade(idx){ const o=gradeOf(idx); return o?o.g:"–"; }
const GCOL = {S:"var(--gS)",A:"var(--gA)",B:"var(--gB)",C:"var(--gC)",D:"var(--gD)",F:"var(--gF)","–":"var(--gx)"};
const chip=g=>`<span class="chip" style="background:${GCOL[g]}">${g}</span>`;
const gcell=o=>`<span class="gt">${chip(o?o.g:"–")}<span>${o?o.name:""}</span></span>`;
const fmt=v=>v==null?"–":v.toFixed(1);

// meta fields
["m-co","m-who","m-date"].forEach(id=>{
  const el = document.getElementById(id);
  try{ el.value = localStorage.getItem("dx-"+id) || (id==="m-date"? new Date().toISOString().slice(0,10):""); }catch(e){}
  el.addEventListener("input",()=>{ try{localStorage.setItem("dx-"+id, el.value);}catch(e){} if(id==="m-co") update(); });
});

const indBox = document.getElementById("ind");
Object.entries(SPECIAL).forEach(([k,v])=>{
  const b = document.createElement("button"); b.type="button"; b.textContent=v.name; b.dataset.k=k;
  b.addEventListener("click",()=>{ ind=k; save(); render(); });
  indBox.appendChild(b);
});

function render(){
  indBox.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===ind));
  const a = ans();
  const host = document.getElementById("parts"); host.innerHTML="";
  parts().forEach((p,pi)=>{
    const sec = document.createElement("section"); sec.className="part"; sec.id="part"+pi;
    const total = p.groups.reduce((n,g)=>n+g[1].length,0);
    sec.innerHTML = `<div class="parthead"><h2>${pi+1}. ${p.title}${p.special?'<span class="special">업종 특화</span>':''}</h2><div class="ps" id="ps${pi}"></div></div>`;
    p.groups.forEach((g,gi)=>{
      const gd = document.createElement("div"); gd.className="group";
      gd.innerHTML = `<div class="gname">${g[0]}<small id="gs${pi}_${gi}"></small></div><div class="items"></div>`;
      const box = gd.querySelector(".items");
      g[1].forEach((q,qi)=>{
        const key = `${pi}-${gi}-${qi}`; const v = a[key];
        const it = document.createElement("div"); it.className="item"+(v?"":" unanswered"); it.dataset.key=key;
        let opts = SCALE.map(([n,l])=>{ const id=`r-${ind}-${key}-${n}`; return `<input type="radio" name="${ind}-${key}" id="${id}" value="${n}" ${v===n?"checked":""}><label for="${id}" title="${l} (${n}점)"><span><b>${l}</b>${n}</span></label>`; }).join("");
        const xid = `r-${ind}-${key}-x`;
        opts += `<input type="radio" name="${ind}-${key}" id="${xid}" value="x" ${v==="x"?"checked":""}><label class="x" for="${xid}" title="진단 제외">제외</label>`;
        it.innerHTML = `<div class="q"><span class="n">${CIRC[qi]}</span>${q}</div><div class="scale" role="radiogroup" aria-label="${g[0]} ${qi+1}번 평가">${opts}</div>`;
        it.addEventListener("change",e=>{ a[key]=e.target.value; it.classList.remove("unanswered"); save(); update(); });
        box.appendChild(it);
      });
      sec.appendChild(gd);
    });
    host.appendChild(sec);
  });
  update();
}

function calc(){
  const a = ans();
  return parts().map((p,pi)=>{
    let sum=0, n=0, ex=0, total=0;
    const gs = p.groups.map((g,gi)=>{ let s=0,c=0; g[1].forEach((_,qi)=>{ total++; const v=a[`${pi}-${gi}-${qi}`]; if(v==="x") ex++; else if(v){ s+=+v; c++; } }); sum+=s; n+=c; return {s,c,max:g[1].length*5}; });
    const idx = n? sum/(n*5)*100 : null;
    return {sum,n,ex,total,idx,gs};
  });
}

function update(){
  const r = calc(); const P = parts();
  let sum=0,n=0,ex=0,total=0;
  r.forEach((x,pi)=>{
    sum+=x.sum; n+=x.n; ex+=x.ex; total+=x.total;
    const g = grade(x.idx);
    document.getElementById("ps"+pi).innerHTML = `<span>${x.sum}점 / ${x.n*5} · 응답 ${x.n+x.ex}/${x.total}</span>${chip(g)}<b style="min-width:3.2em;text-align:right">${fmt(x.idx)}</b>`;
    x.gs.forEach((gg,gi)=>{ document.getElementById(`gs${pi}_${gi}`).textContent = gg.c? `${gg.s}점 · 평균 ${(gg.s/gg.c).toFixed(1)}` : `${P[pi].groups[gi][1].length}문항`; });
  });
  const tidx = n? sum/(n*5)*100 : null; const to = gradeOf(tidx);
  const names = [...SHORT, SPECIAL[ind].short];
  const done = n+ex;

  // dock
  document.getElementById("t-bar").style.width = (done/total*100)+"%";
  document.getElementById("d-cnt").textContent = `응답 ${done}/${total}`;

  // overall
  const co=document.getElementById("m-co").value;
  document.getElementById("r-lead").textContent = `${co?co+" · ":""}${SPECIAL[ind].name} · 응답 ${done}/${total}문항${ex?` (제외 ${ex})`:""}` + (done<total?` · 미응답 ${total-done}문항이 있어 결과가 확정되지 않았습니다.`:" · 전 문항 응답 완료");
  const rg=document.getElementById("r-grade"); rg.textContent = to?to.g:"–"; rg.style.background = GCOL[to?to.g:"–"];
  document.getElementById("r-gname").textContent = to? to.name : "미응답";
  document.getElementById("r-idx").textContent = to? `종합 평가지수 ${fmt(tidx)} · ${sum}점 / ${n*5}점` : "문항을 체크하면 결과가 표시됩니다.";
  document.getElementById("r-act").innerHTML = to? `${to.act}<span>${to.desc}</span>` : "";

  // parts table
  let h = `<colgroup><col style="width:24%"><col style="width:12%"><col style="width:9%"><col style="width:10%"><col style="width:14%"><col style="width:31%"></colgroup><thead><tr><th class="l">부문</th><th>획득점수</th><th>응답</th><th>평가지수</th><th>평가등급</th><th class="l">필요조치</th></tr></thead><tbody>`;
  r.forEach((x,i)=>{ const o=gradeOf(x.idx);
    h+=`<tr><td>${i+1}. ${P[i].title}</td><td class="r">${x.sum} / ${x.n*5}</td><td class="c">${x.n+x.ex}/${x.total}</td><td class="r"><b>${fmt(x.idx)}</b></td><td class="c">${gcell(o)}</td><td>${o?o.desc:"–"}</td></tr>`; });
  h+=`<tr class="sum"><td>종합</td><td class="r">${sum} / ${n*5}</td><td class="c">${done}/${total}</td><td class="r">${fmt(tidx)}</td><td class="c">${gcell(to)}</td><td>${to?to.desc:"–"}</td></tr></tbody>`;
  document.getElementById("t-parts").innerHTML = h;

  // detail table + radar per part
  const dh = r.map((x,i)=>{
    let d = `<colgroup><col style="width:28%"><col style="width:10%"><col style="width:17%"><col style="width:12%"><col style="width:13%"><col style="width:20%"></colgroup><thead><tr><th class="ph" colspan="6">${i+1}. ${P[i].title}</th></tr><tr><th class="l">진단항목</th><th>문항</th><th>획득점수</th><th>평균</th><th>평가지수</th><th>평가등급</th></tr></thead><tbody>`;
    x.gs.forEach((gg,gi)=>{ const gi2 = gg.c? gg.s/(gg.c*5)*100 : null; const o=gradeOf(gi2);
      d+=`<tr><td>${P[i].groups[gi][0]}</td><td class="c">${P[i].groups[gi][1].length}</td><td class="r">${gg.c?gg.s+" / "+gg.c*5:"–"}</td><td class="r">${gg.c?(gg.s/gg.c).toFixed(2):"–"}</td><td class="r">${fmt(gi2)}</td><td class="c">${gcell(o)}</td></tr>`; });
    const o=gradeOf(x.idx);
    d+=`<tr class="sum"><td>부문 계</td><td class="c">${x.total}</td><td class="r">${x.sum} / ${x.n*5}</td><td class="r">${x.n?(x.sum/x.n).toFixed(2):"–"}</td><td class="r">${fmt(x.idx)}</td><td class="c">${gcell(o)}</td></tr></tbody>`;
    return `<div class="drow"><div class="tblwrap"><table class="rt">${d}</table></div>${miniPanel(x,i,P)}</div>`;
  }).join("");
  document.getElementById("detail").innerHTML = dh;


  // criteria table
  let c = `<colgroup><col style="width:8%"><col style="width:13%"><col style="width:21%"><col style="width:17%"><col style="width:41%"></colgroup><thead><tr><th colspan="2">평가등급</th><th>평가지수 범위</th><th colspan="2">평가등급 내용 및 필요조치</th></tr></thead><tbody>`;
  GRADES.forEach(o=>{ c+=`<tr class="${to&&to.g===o.g?"cur":""}"><td class="c">${chip(o.g)}</td><td class="c">${o.name}</td><td class="c">${o.range}</td><td class="c">${o.act}</td><td>${o.desc}</td></tr>`; });
  document.getElementById("t-crit").innerHTML = c+"</tbody>";

  drawRadar(r.map(x=>x.idx), names);
}

function radarSVG(vals, names, opt={}){
  const W=opt.w||300, H=opt.h||250, cx=W/2, cy=opt.cy||H/2+4, R=opt.r||88, N=vals.length, M=opt.max||100;
  const LV = M===5?[1,2,3,4,5]:[20,40,60,80,100], TK = M===5?[1,2,3,4,5]:[50,100];
  const pt=(i,rad)=>{ const a=-Math.PI/2+i*2*Math.PI/N; return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; };
  let h="";
  LV.forEach(l=>{ h+=`<polygon points="${[...Array(N)].map((_,i)=>pt(i,R*l/M).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  for(let i=0;i<N;i++){ const [x,y]=pt(i,R); h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }
  TK.forEach(l=>{ h+=`<text x="${cx+3}" y="${cy-R*l/M+10}" style="font-size:9px">${l}</text>`; });
  if(vals.some(v=>v!=null)){
    const poly = vals.map((v,i)=>pt(i,R*(v||0)/M).join(",")).join(" ");
    h+=`<polygon points="${poly}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    vals.forEach((v,i)=>{ if(v!=null){ const [x,y]=pt(i,R*v/M); h+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`; } });
  }
  names.forEach((nm,i)=>{ const [x,y]=pt(i,R+18); const anc = Math.abs(x-cx)<5?"middle":(x>cx?"start":"end");
    const dy = Math.abs(x-cx)<5 ? (y<cy?-6:10) : 0;
    h+=`<text x="${x}" y="${y+dy}" text-anchor="${anc}">${nm}</text>`;
    if(opt.values){ h+=`<text x="${x}" y="${y+dy+13}" text-anchor="${anc}" style="font-weight:700;fill:var(--ink)">${vals[i]==null?"–":(M===5?vals[i].toFixed(2):vals[i].toFixed(1))}</text>`; } });
  return h;
}
function drawRadar(vals, names){ document.getElementById("radar").innerHTML = radarSVG(vals, names, {w:340,h:290,r:86,cy:148,values:true}); }
function miniPanel(x,i,P){
  const vals = x.gs.map(gg=> gg.c? gg.s/gg.c : null);
  const names = P[i].groups.map(g=>g[0]);
  const weak = vals.map((v,j)=>[v,names[j]]).filter(z=>z[0]!=null).sort((a,b)=>a[0]-b[0])[0];
  return `<div class="panel mini">
    <svg class="radar" viewBox="0 0 340 290" width="100%" role="img" aria-label="${P[i].title} 세부항목 방사형 차트">${radarSVG(vals,names,{w:340,h:290,r:86,cy:148,values:true,max:5})}</svg>
    <div class="mf">${weak?`5점 만점 평균 · 보완 우선: <b>${weak[1]}</b> (${weak[0].toFixed(2)}점)`:"응답하면 차트가 표시됩니다."}</div></div>`;
}

const msg = document.getElementById("msg");
let armed=false;
document.getElementById("b-reset").addEventListener("click",e=>{
  if(!armed){ armed=true; e.target.textContent="한 번 더 누르면 초기화"; setTimeout(()=>{armed=false; e.target.textContent="현재 업종 초기화";},3000); return; }
  armed=false; e.target.textContent="현재 업종 초기화"; store[ind]={}; save(); render(); msg.textContent=`${SPECIAL[ind].name} 응답을 초기화했습니다.`;
});
document.getElementById("b-copy").addEventListener("click",()=>{
  const r=calc(); const names=[...SHORT, SPECIAL[ind].short];
  let sum=0,n=0; r.forEach(x=>{sum+=x.sum;n+=x.n;});
  const t = n? sum/(n*5)*100:null;
  const co=document.getElementById("m-co").value, who=document.getElementById("m-who").value, dt=document.getElementById("m-date").value;
  let txt = `[경영진단 결과] ${co||""} / ${SPECIAL[ind].name} / ${who||""} / ${dt||""}\n`;
  r.forEach((x,i)=>{ const o=gradeOf(x.idx); txt += `${i+1}. ${names[i]}: ${fmt(x.idx)}점 · ${o?o.g+" "+o.name+" · "+o.desc:"-"}\n`; });
  const ot=gradeOf(t); txt += `종합: ${fmt(t)}점 · ${ot?ot.g+" "+ot.name+" · "+ot.desc:"-"}`;
  const done=()=>msg.textContent="결과를 클립보드에 복사했습니다.";
  try{ navigator.clipboard.writeText(txt).then(done).catch(()=>{msg.textContent=txt;}); }catch(e){ msg.textContent=txt; }
});

render();
</script>
